[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arma-unit-platform"
description = "Discord-based unit management platform for an Arma 3 community"
readme = "README.md"
requires-python = ">=3.12"
dynamic = ["version"]
dependencies = [
    # Discord interface
    "discord.py>=2.4,<3",
    # HTTP/API layer (webhooks, telemetry, future dashboard)
    "fastapi>=0.115",
    "uvicorn>=0.30",
    # Async HTTP client for integrations (GitHub) and API tests
    "httpx>=0.27",
    # AI assistant — one SDK for every OpenAI-compatible provider (OpenAI,
    # Gemini's compatibility endpoint, and others via AI_BASE_URL)
    "openai>=1.60",
    # AI assistant — Claude via the official Anthropic SDK (AI_PROVIDER=claude)
    "anthropic>=1.1",
    # Google Sheets export (unit data mirrored to a staff spreadsheet)
    "gspread>=6.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",         # PostgreSQL (production)
    "aiosqlite>=0.20",       # SQLite (tests / quick local runs)
    "alembic>=1.13",
    # Configuration
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    # IANA timezone database (Windows has none built in; zoneinfo needs it)
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[project.scripts]
arma-bot = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.dynamic]
version = { attr = "app.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
